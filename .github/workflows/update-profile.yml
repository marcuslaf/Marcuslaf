name: Update Profile Assets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'   # Every Sunday at 06:00 UTC
    - cron: '0 6 1 * *'   # Every 1st of month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate top-langs SVG
        run: python scripts/gen_top_langs.py

      - name: Generate contribution grid SVG
        run: python scripts/gen_contribution_grid.py

      - name: Generate custom header SVG
        run: echo "assets/header.svg is static — update manually if needed"
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config user.name "marcuslaf[bot]"
          git config user.email "166660635+marcuslaf@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update profile assets [skip ci]" && git push
